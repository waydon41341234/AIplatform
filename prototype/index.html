<script>
  /* 原型专用的快捷切换条（右下角，手机宽度隐藏），不属于平台界面。 */
  window.PROTO_BAR = function () {
    var L = window.LANGS.map(function (l) { return '<button data-act="setLang" data-arg="' + l.code + '"' + (S.lang === l.code ? ' style="background:#ffffff33"' : '') + '>' + l.code + '</button>'; }).join('');
    return '<div class="proto-bar" aria-hidden="true"><button data-act="setTheme">' + (S.theme === 'dark' ? '☾' : '☀') + '</button>' + L + '</div>';
  };
</script>
